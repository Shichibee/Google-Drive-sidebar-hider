<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Drive Sidebar Toggler 設定</title>
  <style>
    body { font-family: sans-serif; padding: 20px; color: #333; }
    h2 { margin-bottom: 10px; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    .checkbox-label { font-weight: normal; display: flex; align-items: center; cursor: pointer; }
    .checkbox-label input { margin-right: 8px; transform: scale(1.2); }
    input[type="number"] { padding: 5px; width: 100px; font-size: 16px; margin-top: 5px; }
    
    /* ボタンのデザイン */
    button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; font-size: 14px; }
    #save-button { background: #1a73e8; color: white; }
    #save-button:hover { background: #1557b0; }
    /* ★追加：リセットボタンのデザイン */
    #reset-button { background: #f1f3f4; color: #333; margin-left: 10px; border: 1px solid #dadce0; }
    #reset-button:hover { background: #e8eaed; }
    
    .status { font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>拡張機能の設定</h2>
  
  <div class="field">
    <label class="checkbox-label">
      <input type="checkbox" id="auto-hide-enable">
      ウィンドウ幅に合わせて自動で開閉する機能を有効にする
    </label>
  </div>

  <div class="field">
    <label for="width-input">自動で閉じるウィンドウ幅 (px):</label>
    <input type="number" id="width-input" min="200" max="3000">
  </div>
  
  <button id="save-button">設定を保存</button>
  <button id="reset-button">初期値に戻す</button>

  <div id="status-message" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
